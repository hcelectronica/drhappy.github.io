<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dr Happy · Híbrido: barra en PC, botonera en móvil</title>
<style>
  :root {
    --bg: #eef2f9;
    --panel: rgba(255,255,255,.92);
    --ink: #2c3f5e;
    --ink-soft: #7d90b2;
    --line: rgba(197,209,231,.75);
    --accent: #4d7ad4;
    --shadow-soft: 0 10px 24px rgba(88,105,140,.10), 0 28px 60px rgba(70,88,125,.14);
    --break: 900px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px;
    font-family: Manrope, 'Segoe UI', Tahoma, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 12% -10%, rgba(126,163,239,.20), transparent 60%),
      radial-gradient(900px 480px at 96% 8%, rgba(129,209,201,.18), transparent 62%),
      var(--bg);
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  .mode-flag {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 12px; padding: 8px 13px;
    border: 1px dashed rgba(129,160,220,.6); border-radius: 12px;
    background: rgba(230,238,253,.7); color: #3f5c92;
    font-size: .72rem; font-weight: 700;
  }
  .mode-flag b { font-weight: 800; }

  /* ── Encabezado ───────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 12px 16px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: 20px;
    background: var(--panel); box-shadow: var(--shadow-soft);
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(140deg, #4d7ad4, #2f57a8); color: #fff; font-size: 1.25rem;
    box-shadow: 0 8px 18px rgba(61,95,169,.35);
  }
  .brand h1 { margin: 0; font-size: 1.05rem; letter-spacing: -.02em; }
  .brand small { color: var(--ink-soft); font-size: .7rem; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 9px; }
  .chip {
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--ink); font: inherit; font-size: .72rem; font-weight: 700; cursor: pointer;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: #dbe8ff; color: #2f57a8; font-weight: 800; font-size: .82rem; border: 1px solid var(--line);
  }

  /* ── Sofía ────────────────────────────────────────────────── */
  .sofia-bar {
    display: flex; align-items: center; gap: 13px; width: 100%;
    padding: 13px 16px; margin-bottom: 14px;
    border: 1px solid rgba(169,190,229,.6); border-radius: 18px;
    background: linear-gradient(135deg, #eef3ff 0%, #e6edfd 60%, #e9f3f1 100%);
    color: #35507d; text-align: left; font: inherit; cursor: pointer;
    box-shadow: 0 8px 20px rgba(94,122,175,.16);
    transition: transform 180ms ease;
  }
  .sofia-bar:hover { transform: translateY(-2px); }
  .sofia-orb {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 40px;
    background: radial-gradient(circle at 32% 30%, #fff, #cfe0ff 55%, #9fc0f5);
    color: #2f57a8; font-size: 1.1rem; animation: pulse 2.6s ease-in-out infinite;
  }
  .sofia-copy { display: grid; gap: 1px; min-width: 0; }
  .sofia-copy strong { font-size: .92rem; }
  .sofia-copy small { color: var(--ink-soft); font-size: .72rem; font-weight: 600; }
  .sofia-go { margin-left: auto; font-size: .72rem; font-weight: 800; color: var(--accent); white-space: nowrap; }

  .section-kicker {
    display: block; margin: 4px 2px 9px;
    color: var(--ink-soft); font-size: .62rem; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase;
  }

  /* ── MÓVIL: botonera ──────────────────────────────────────── */
  .botonera {
    display: grid; gap: 10px; margin-bottom: 18px;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  }
  .smart-btn {
    position: relative; display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; min-height: 58px;
    border: 1px solid var(--line); border-radius: 15px;
    background: var(--panel); color: var(--ink); font: inherit; text-align: left; cursor: pointer;
    box-shadow: 0 4px 12px rgba(88,105,140,.08);
    transition: transform 180ms cubic-bezier(.22,1,.36,1), box-shadow 180ms ease, border-color 180ms ease;
  }
  .smart-btn:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--tone) 55%, var(--line)); box-shadow: 0 12px 26px color-mix(in srgb, var(--tone) 22%, transparent); }
  .smart-ico {
    flex: 0 0 34px; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    font-size: 1.05rem; background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone);
    transition: transform 220ms cubic-bezier(.22,1,.36,1);
  }
  .smart-btn:hover .smart-ico { transform: scale(1.1) rotate(-4deg); }
  .smart-txt { display: grid; gap: 1px; min-width: 0; }
  .smart-txt strong { font-size: .8rem; font-weight: 700; }
  .smart-txt small { color: var(--ink-soft); font-size: .66rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    position: absolute; top: 8px; right: 9px; min-width: 19px; padding: 1px 6px; border-radius: 999px;
    background: var(--tone); color: #fff; font-size: .62rem; font-weight: 800; text-align: center;
  }
  .smart-btn.wide { grid-column: span 2; }
  .smart-btn.ambulance { background: linear-gradient(135deg, rgba(236,255,245,.95), rgba(224,248,237,.95)); }

  /* ── PC: barra desplegable + lengüeta ─────────────────────── */
  .sidebar {
    position: fixed; z-index: 50; inset: 20px auto 20px 20px; width: 262px;
    display: flex; flex-direction: column; padding: 18px 16px;
    border: 1px solid var(--line); border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(243,246,253,.96) 55%, rgba(237,241,251,.96) 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 10px 24px rgba(88,105,140,.1), 0 28px 60px rgba(70,88,125,.16);
    transform: translateX(calc(-100% - 36px));
    transition: transform 220ms cubic-bezier(.22,1,.36,1);
    overflow-y: auto;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 2px 4px 14px; border-bottom: 1px solid var(--line); }
  .sidebar-head strong { display: block; font-size: .92rem; }
  .sidebar-head small { color: var(--ink-soft); font-size: .62rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  .sidebar-x { border: 0; background: none; color: #9aa9c2; font-size: 1.35rem; cursor: pointer; }
  .sidebar-sofia {
    display: flex; align-items: center; gap: 11px; width: 100%; margin: 14px 0 2px; padding: 12px 13px;
    border: 1px solid rgba(169,190,229,.7); border-radius: 15px;
    background: linear-gradient(135deg, #eef3ff, #e5edfd); color: #35507d;
    font: inherit; text-align: left; cursor: pointer; box-shadow: 0 6px 16px rgba(94,122,175,.14);
  }
  .sidebar-sofia b { font-size: .86rem; }
  .sidebar-sofia small { display: block; color: var(--ink-soft); font-size: .68rem; font-weight: 600; }
  .sidebar-nav { display: grid; gap: 4px; padding: 14px 0; }
  .sidebar-nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; min-height: 42px; padding: 10px 12px;
    border: 1px solid transparent; border-radius: 13px; background: transparent;
    color: #55668a; font: inherit; font-size: .8rem; font-weight: 600; text-align: left; cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
  }
  .sidebar-nav button > span:first-child { width: 21px; color: #7b96cc; text-align: center; font-size: 1rem; }
  .sidebar-nav button:hover { background: rgba(228,236,252,.72); color: #35507d; }
  .sidebar-nav button.active { background: linear-gradient(135deg, #e7eefd, #dde7fb); color: #2f4c7d; }
  .sidebar-nav button em { margin-left: auto; padding: 2px 8px; border-radius: 999px; background: #e8eefc; color: #5273bb; font-size: .66rem; font-weight: 800; font-style: normal; }
  .handle {
    position: fixed; z-index: 60; top: 50%; left: 0; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    width: 26px; min-height: 96px; padding: 12px 0;
    border: 1px solid rgba(178,196,224,.75); border-left: 0; border-radius: 0 16px 16px 0;
    background: linear-gradient(135deg, rgba(247,249,255,.97), rgba(232,238,252,.94));
    color: #5a6c8c; cursor: pointer; box-shadow: 6px 8px 20px rgba(76,95,130,.16);
  }
  .handle span:first-child { font-size: 1.05rem; font-weight: 700; }
  .handle span:last-child { font-size: .56rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; writing-mode: vertical-rl; }
  .scrim { position: fixed; z-index: 40; inset: 0; border: 0; background: rgba(23,38,62,.22); cursor: pointer; }

  /* ── Flyer ────────────────────────────────────────────────── */
  .flyer { padding: clamp(18px,4vw,34px); border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: var(--shadow-soft); }
  .flyer-inner {
    display: grid; grid-template-columns: minmax(0,1fr) minmax(240px,.85fr); gap: 24px; align-items: center;
    width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .flyer-copy { display: grid; gap: 9px; }
  .flyer-copy h2 { margin: 0; font-size: clamp(1.3rem,3vw,2rem); line-height: 1.08; letter-spacing: -.02em; }
  .flyer-copy p { margin: 0; color: var(--ink-soft); font-size: .88rem; line-height: 1.55; }
  .flyer-cta { color: var(--tone); font-size: .74rem; font-weight: 800; }
  .flyer-visual {
    min-height: 168px; padding: 14px; border-radius: 16px; display: grid; gap: 9px; align-content: start;
    border: 1px solid color-mix(in srgb, var(--tone) 28%, var(--line));
    background: linear-gradient(145deg, color-mix(in srgb, var(--tone) 12%, var(--panel)), var(--panel));
    box-shadow: 0 16px 30px color-mix(in srgb, var(--tone) 16%, transparent);
    font-size: .76rem; color: var(--ink-soft);
  }
  .flyer-visual b { color: var(--ink); font-size: .82rem; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
    padding: 11px 18px; border-radius: 14px; background: rgba(28,44,74,.94); color: #fff;
    font-size: .8rem; font-weight: 700; opacity: 0; pointer-events: none; z-index: 70;
    transition: opacity 220ms ease, transform 220ms ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(126,163,239,.18); } 50% { box-shadow: 0 0 0 8px rgba(126,163,239,.10); } }

  /* ══ EL INTERRUPTOR: una sola media query decide todo ══ */
  .only-desktop { display: none; }
  @media (min-width: 900px) {
    .only-mobile { display: none !important; }
    .only-desktop { display: initial; }
    .wrap { padding-left: 46px; }
  }
  @media (max-width: 899px) {
    .flyer-inner { grid-template-columns: 1fr; gap: 16px; }
    .botonera { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    .topbar { flex-direction: column; align-items: stretch; }
    .topbar-right { justify-content: space-between; }
  }
</style>
</head>
<body>

<!-- Solo PC: barra desplegable con lengüeta -->
<aside class="sidebar only-desktop" id="sidebar">
  <div class="sidebar-head">
    <div><small>Espacio profesional</small><strong>Dr. Alan Médico</strong></div>
    <button class="sidebar-x" id="sidebarX">×</button>
  </div>
  <button class="sidebar-sofia" data-go="Sofía"><span>✦</span><span><b>Sofía</b><small>Tu secretaria clínica</small></span></button>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
</aside>
<button class="handle only-desktop" id="handle"><span id="handleArrow">›</span><span>Menú</span></button>
<div class="only-desktop" id="scrimSlot"></div>

<div class="wrap">

  <p class="mode-flag">
    <b id="modeText">Cargando…</b>
    <span>· Achicá o agrandá la ventana del navegador para ver el cambio automático.</span>
  </p>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✚</span>
      <div><h1>Dr Happy 😊</h1><small>Basta de papeleo, hagamos medicina.</small></div>
    </div>
    <div class="topbar-right">
      <button class="chip">◐ Modo nocturno</button>
      <button class="chip">↪ Salir</button>
      <span class="avatar">AM</span>
    </div>
  </header>

  <!-- Solo móvil: Sofía + botonera -->
  <button class="sofia-bar only-mobile" data-go="Sofía">
    <span class="sofia-orb">✦</span>
    <span class="sofia-copy"><strong>Sofía</strong><small>Tu secretaria clínica · agendá y cobrá por voz</small></span>
    <span class="sofia-go">Hablar →</span>
  </button>

  <div class="only-mobile">
    <span class="section-kicker">Accesos rápidos</span>
    <div class="botonera" id="botonera"></div>
  </div>

  <span class="section-kicker">Destacado</span>
  <section class="flyer">
    <button class="flyer-inner" style="--tone:#d97706" data-go="Turnera médica">
      <span class="flyer-copy">
        <h2>◷ Turnera médica</h2>
        <p>Organizá tus días, definí cupos y ofrecé turnos libres con horarios segmentados.</p>
        <span class="flyer-cta">Tocá para abrir →</span>
      </span>
      <span class="flyer-visual">
        <b>Agenda semanal</b><span>09:00 · García, María</span><span>10:30 · López, Juan</span><span>12:00 · Turno libre</span>
      </span>
    </button>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  const OPCIONES = [
    { ico: '🚑', label: 'Modo Ambulancia', sub: 'Traslados y guardia', tone: '#15945f', wide: true, cls: 'ambulance' },
    { ico: '⌂', label: 'Inicio', sub: 'Panel principal', tone: '#4d7ad4', active: true },
    { ico: '♙', label: 'Atención médica', sub: 'Buscar y atender', tone: '#2563eb' },
    { ico: '◷', label: 'Turnera', sub: 'Agenda y cupos', tone: '#d97706', badge: '4' },
    { ico: '👥', label: 'Mis pacientes', sub: '19 fichas', tone: '#0891b2' },
    { ico: '✦', label: 'Herramientas', sub: 'Protocolos y vademécum', tone: '#7c3aed', badge: '2' },
    { ico: '◈', label: 'Balance de pagos', sub: 'Deudas y cobros', tone: '#dc2626' },
    { ico: '◫', label: 'Noticias médicas', sub: 'Actualidad clínica', tone: '#475569' },
    { ico: '◉', label: 'Perfil y ajustes', sub: 'Firma y datos', tone: '#4f46e5' },
  ]

  // Misma lista de opciones alimentando las dos presentaciones.
  const botonera = document.getElementById('botonera')
  const nav = document.getElementById('sidebarNav')
  OPCIONES.forEach((o) => {
    const b = document.createElement('button')
    b.className = 'smart-btn' + (o.wide ? ' wide' : '') + (o.cls ? ' ' + o.cls : '')
    b.style.setProperty('--tone', o.tone)
    b.innerHTML = (o.badge ? '<span class="badge">' + o.badge + '</span>' : '') +
      '<span class="smart-ico">' + o.ico + '</span>' +
      '<span class="smart-txt"><strong>' + o.label + '</strong><small>' + o.sub + '</small></span>'
    b.addEventListener('click', () => toast('Abriría: ' + o.label))
    botonera.appendChild(b)

    const n = document.createElement('button')
    if (o.active) n.className = 'active'
    n.innerHTML = '<span>' + o.ico + '</span>' + o.label + (o.badge ? '<em>' + o.badge + '</em>' : '')
    n.addEventListener('click', () => { toast('Abriría: ' + o.label); closeSidebar() })
    nav.appendChild(n)
  })

  const sidebar = document.getElementById('sidebar')
  const handle = document.getElementById('handle')
  const handleArrow = document.getElementById('handleArrow')
  const scrimSlot = document.getElementById('scrimSlot')

  function openSidebar() {
    sidebar.classList.add('open'); handleArrow.textContent = '‹'
    const s = document.createElement('button'); s.className = 'scrim'
    s.addEventListener('click', closeSidebar); scrimSlot.appendChild(s)
  }
  function closeSidebar() {
    sidebar.classList.remove('open'); handleArrow.textContent = '›'; scrimSlot.innerHTML = ''
  }
  handle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar())
  document.getElementById('sidebarX').addEventListener('click', closeSidebar)

  const toastEl = document.getElementById('toast')
  let t = null
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(t); t = setTimeout(() => toastEl.classList.remove('show'), 1600) }
  document.querySelectorAll('[data-go]').forEach((el) => el.addEventListener('click', () => toast('Abriría: ' + el.dataset.go)))

  const mq = window.matchMedia('(min-width: 900px)')
  function flag() {
    document.getElementById('modeText').textContent = mq.matches
      ? '🖥 Modo PC: barra desplegable con lengüeta'
      : '📱 Modo móvil: botonera de accesos rápidos'
    if (!mq.matches) closeSidebar()
  }
  mq.addEventListener('change', flag)
  flag()
</script>
</body>
</html>
