<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patient tools fixture</title></head>
<body><div id="root"></div><script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import PatientGlucoseView from '../src/PatientGlucoseView.tsx'
import { PatientPortal } from '../src/PatientPortal.tsx'
import { GlucoseSummary } from '../src/GlucoseSummary.tsx'
import SharedFolderPage from '../src/SharedFolderPage.tsx'
import { PatientAccountDeletion } from '../src/PatientAccountDeletion.tsx'
import { AdminPatientStats } from '../src/AdminPatientStats.tsx'
import { ErrorNotificationProvider } from '../src/ErrorNotifications.tsx'
import { AdminPatientCommunications } from '../src/AdminPatientCommunications.tsx'
import '../src/index.css'
import '../src/App.css'
import '../src/PatientPortal.css'
import '../src/adminPatientStats.css'

const params = new URLSearchParams(location.search)
const patient = { id: 'fixture-patient', firstName: 'Paciente', lastName: 'Ficticio', fullName: 'Paciente Ficticio',
  email: 'fixture@example.invalid', dni: '00000000', birthDate: null, phone: null, storageUsedBytes: 0, storageQuotaBytes: 104857600, createdAt: new Date().toISOString() }
Object.assign(patient, JSON.parse(sessionStorage.getItem('patient-tools-profile') || '{}'))
let record = JSON.parse(sessionStorage.getItem('patient-tools-record') || '{"readings":[],"totalReadings":0,"treatment":null,"updatedAt":null}')
let campaign = null, news = false
let backup = null
window.fixtureCalls = []
window.fixtureNotices = []
const realFetch = window.fetch.bind(window)
const store = () => sessionStorage.setItem('patient-tools-record', JSON.stringify(record))
window.fetch = async (input, init) => {
  const url = typeof input === 'string' ? input : input.url || String(input)
  if (!url.includes('.supabase.co')) return realFetch(input, init)
  if (!url.includes('/functions/v1/')) throw new Error(`Unexpected fixture network request: ${url}`)
  const body = JSON.parse(init?.body || '{}')
  window.fixtureCalls.push({ endpoint: url.split('/').at(-1), ...body })
  let result = { success: true }, status = 200
  if (url.includes('admin-stats')) {
    result.stats = { summary: { total: 1, verified: 1, pending: 0, registrations7d: 1, registrations30d: 1, active_today: 1, active7d: 1, active30d: 1, minutes30d: 1, games30d: 0, invites30d: 0 },
      documents: { count: 0, bytes: 0, patients: 0 }, pressure: { count: 0, patients: 0 }, shares: { doctor: 0, link: 0 }, notices: { sent: 0, pending: 0 },
      recent: [{ id: 'fixture-patient', full_name: patient.fullName, email: patient.email, active: true, created_at: patient.createdAt, email_verified_at: patient.createdAt, last_seen_at: null, last_login_at: null }],
      daily: [], features: {}, trackingSince: '2026-10-16', generatedAt: new Date().toISOString() }
  } else if (url.includes('patient-account-admin')) {
    if (body.action === 'prepare') backup = { total: 2, counts: { pending: 2, sending: 0, sent: 0, failed: 0, uncertain: 0 } }
    if (body.action === 'send-next') {
      if (window.fixtureBackupFail) {
        status = 409; result = { success: false, message: 'Error simulado de copia. No se eliminó la cuenta.', backup }
      } else { backup.counts.pending--; backup.counts.sent++ }
    }
    if (body.action === 'delete') result.deleted = true
    result.backup = backup
  } else if (url.includes('patient-communications')) {
    if (body.action === 'contacts') result = { ...result, virtualReady: true, contacts: [
      { id: '1', name: 'Paciente Uno', email: 'uno@example.invalid', eligible: true, reason: '' },
      { id: '2', name: 'Paciente Dos', email: 'dos@example.invalid', eligible: true, reason: '' },
      ...(body.audience === 'folder' ? [{ id: '3', name: 'Paciente Baja', email: 'baja@example.invalid', eligible: false, reason: 'Solicitó la baja' }] : []),
    ] }
    if (body.action === 'preview') {
      const total = body.all ? 2 : body.contactIds.length
      campaign = { id: body.campaignId, audience: body.audience, template: body.template, subject: body.subject, message: body.message,
        link: body.template === 'folder' ? 'https://www.drhappy.com.ar/paciente' : 'https://www.drhappy.com.ar/consulta/fixture',
        created_at: new Date().toISOString(), status: 'draft', total, counts: { pending: total, sending: 0, sent: 0, failed: 0, uncertain: 0, skipped: 0 } }
      result.campaign = campaign
    }
    if (body.action === 'send-batch') {
      campaign.status = 'active'; campaign.counts.sent = campaign.total; campaign.counts.pending = 0; result.campaign = campaign
    }
    if (body.action === 'status') result.campaign = campaign
    if (body.action === 'history') result.campaigns = campaign ? [campaign] : []
  } else {
    if (body.action === 'me') result.patient = patient
    if (body.action === 'update-profile') {
      Object.assign(patient, { firstName: body.firstName, lastName: body.lastName, phone: body.phone, birthDate: body.birthDate,
        healthInsurance: body.healthInsurance, insuranceMemberNumber: body.insuranceMemberNumber })
      sessionStorage.setItem('patient-tools-profile', JSON.stringify(patient)); result.patient = patient
    }
    if (body.action === 'search-doctors') {
      if (window.fixtureSearchDelay) await new Promise(resolve => setTimeout(resolve, window.fixtureSearchDelay))
      if (window.fixtureSearchError) { status = 503; result = { success: false, message: 'No se pudo buscar. Intentá nuevamente.' } }
      else result = { success: true, doctors: body.query.toLowerCase().includes('nadie') ? [] : [
        { id: 'doctor-1', name: 'María Gómez', specialty: 'Clínica médica' },
        { id: 'doctor-2', name: 'Mariano Gómez', specialty: 'Cardiología' },
      ], hasMoreDoctors: false }
    }
    if (body.action === 'list-documents') result = { ...result, patient, documents: [] }
    if (body.action === 'link-requests') result.requests = [{ id: 'request', source: 'doctor_request', doctorName: 'Médico ficticio', doctorSpecialty: 'Clínica' }]
    if (body.action === 'list-shares') result.shares = []
    if (body.action === 'create-link-share') result = { ...result, url: 'https://www.drhappy.com.ar/carpeta/fixture-share-token', code: '123456', expiresAt: new Date(Date.now() + 86400000).toISOString() }
    if (body.action === 'open-share') {
      if (window.fixtureRevoke) { result = { success: false, message: 'El paciente dejó de compartir este acceso.' }; status = 404 }
      else result = { ...result, patientName: 'Paciente Ficticio', birthDate: null, expiresAt: new Date(Date.now() + 86400000).toISOString(), urlTtlSeconds: 600, documents: [], pressure: [], glucose: record }
    }
    if (body.action === 'news-preference-save') news = body.enabled
    if (body.action.startsWith('news-preference')) result.newsEnabled = news
    if (body.action === 'glucose-add') {
      record.readings.unshift({ id: crypto.randomUUID(), measuredAt: body.measuredAt, value: body.value, context: body.context, method: body.method, note: body.note })
      record.totalReadings = record.readings.length; store()
    }
    if (body.action === 'diabetes-save') { record.treatment = body.treatment; record.updatedAt = new Date().toISOString(); store() }
    if (body.action === 'glucose-delete') {
      record.readings = record.readings.filter(r => r.id !== body.readingId); record.totalReadings = record.readings.length; store()
    }
    if (body.action.startsWith('glucose-') || body.action === 'diabetes-save') result.glucose = record
  }
  return new Response(JSON.stringify(result), { status, headers: { 'Content-Type': 'application/json' } })
}
localStorage.setItem('drhappy-patient-session', 'fixture-only-session')
sessionStorage.setItem('drhappy-patient-install-offered', '1')
const notify = value => { window.fixtureNotices.push(value) }
function Administration() {
  const [mail, setMail] = React.useState(false)
  return mail ? React.createElement(AdminPatientCommunications, { initialAudience: 'folder' })
    : React.createElement(AdminPatientStats, { onCommunications: () => setMail(true) })
}
createRoot(document.getElementById('root')).render(
  params.has('administration') ? React.createElement(ErrorNotificationProvider, null, React.createElement('main', { className: 'app' }, React.createElement(Administration)))
  : params.has('deletion') ? React.createElement('main', { className: 'admin-patient-stats', style: { padding: '12px' } },
    React.createElement(PatientAccountDeletion, { patient: { id: 'fixture-patient', full_name: 'Paciente Ficticio', email: 'fixture@example.invalid' },
      onDeleted: () => { window.fixtureDeleted = true }, onClose: () => { window.fixtureClosed = true } }))
  : params.has('email') ? React.createElement('main', { className: 'app', style: { padding: '12px' } }, React.createElement(AdminPatientCommunications))
  : params.has('portal') || params.has('unsubscribe') ? React.createElement(PatientPortal)
  : params.has('public') ? React.createElement(SharedFolderPage, { token: 'fixture-share-token' })
  : params.has('summary') ? React.createElement('main', { className: 'pp-main' }, React.createElement(GlucoseSummary, { record, onCopy: notify }))
  : React.createElement('main', { className: 'pp-main' }, React.createElement(PatientGlucoseView, { onToast: notify }))
)
</script></body></html>
