    <script>
      // Redirección inmediata desde GitHub Pages hacia el dominio oficial unificado drhappy.com.ar
      (function() {
        var host = window.location.hostname;
        if (host.includes('github.io')) {
          var cleanPath = window.location.pathname.replace(/^\/drhappy\.github\.io/, '');
          var target = 'https://drhappy.com.ar' + cleanPath + window.location.search + window.location.hash;
          window.location.replace(target);
        }
      })();
    </script>
